name: Remove HUD text from the newest video

# One-off repair, run by hand: Actions -> this workflow -> Run workflow. Blurs the "SHOT nn / nn" readout and the ruler out
# of the newest stored video (long and Short), in place; the original stays beside it as *.orig.mp4.
on:
  workflow_dispatch:

concurrency:
  group: mask-hud
  cancel-in-progress: false

jobs:
  mask:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Mask
        env:
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
        run: python -u -m blogwriter.mask_hud
