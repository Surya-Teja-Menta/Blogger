name: Voice farm worker

# One machine of the voice farm: clones one chunk of a video's narration in the channel owner's own voice
# (Chatterbox + faster-whisper, MIT) and hands the audio back through the private storage bucket. The "Make one
# topic" job starts about a dozen of these at once while it makes the video (blogwriter/voicefarm.py), so a ten
# minute narration takes about a quarter of an hour instead of two hours. Nobody starts this by hand.
#
# The inputs are only a random folder name and a chunk number (this repository is public): the narration lines,
# the owner's recording and the finished audio stay in the private bucket and are deleted afterwards.
on:
  workflow_dispatch:
    inputs:
      prefix:
        description: "Folder in the private bucket (voice-farm/<random>)"
        required: true
      index:
        description: "Which chunk of the narration"
        required: true

permissions:
  contents: read

jobs:
  clone:
    name: voice chunk ${{ inputs.index }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      # the same environment (and cache key) as the "Make one topic" workflow keeps: keep the two identical
      - name: Keep the voice environment between runs
        uses: actions/cache@v4
        with:
          path: |
            .voice
            ~/.cache/huggingface
          key: voice-chatterbox-0.1.7-fw-${{ runner.os }}-py313-v1

      - name: Voice cloning environment
        run: |
          ready() { .voice/bin/python -c "import chatterbox, faster_whisper" 2>/dev/null; }
          if ! ready; then
            rm -rf .voice && python -m venv .voice
            .voice/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            .voice/bin/pip install -q chatterbox-tts==0.1.7 faster-whisper
          fi
          ready
          echo "VOICE_PYTHON=$GITHUB_WORKSPACE/.voice/bin/python" >> "$GITHUB_ENV"

      # only what this job needs: the storage bucket and the voice settings
      - name: Load the storage and voice settings
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          python - <<'EOF'
          import json, os, re, secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for source in ("ALL_VARS", "ALL_SECRETS"):
                  for key, value in json.loads(os.environ.get(source) or "{}").items():
                      if not re.fullmatch(r"(S3_|VOICE_|CLONE_|NARRATOR_)[A-Z0-9_]*", key):
                          continue
                      mark = "END_" + secrets.token_hex(8)
                      env.write(f"{key}<<{mark}\n{value}\n{mark}\n")
          EOF

      - name: Clone this chunk
        env:
          FARM_PREFIX: ${{ inputs.prefix }}
          FARM_INDEX: ${{ inputs.index }}
          CLONE_BUDGET_MINUTES: "60"          # a chunk is about ten minutes of work: far more means something is wrong
        run: python -u -m blogwriter.voice_worker "$FARM_PREFIX" "$FARM_INDEX"
