name: Make one topic

# The shared job behind "Make a video" and "Make a course": research one topic, write the report and make the
# videos (emailed for review, never posted). A long video is rendered on several machines at once (one part
# each), then joined, checked and delivered. Called once per topic or lesson, in parallel.
on:
  workflow_call:
    inputs:
      topic: {type: string, required: true}
      source: {type: string, default: news}          # news = today's hottest story on it; topic = the topic itself
      style: {type: string, default: ""}             # auto, news, story, education, concept
      mode: {type: string, default: standard}        # research depth: fast, standard, deep
      level: {type: string, default: intermediate}
      publish: {type: boolean, default: false}       # list the report on Gumroad and post to the blogs
      video: {type: boolean, default: true}
      queue_id: {type: string, default: ""}          # set when the topic came from the queue
      course: {type: string, default: ""}            # set for a course lesson: the course's slug ...
      lesson_id: {type: string, default: ""}         # ... and the lesson's id in courses/<slug>.json

permissions:
  contents: write          # saves output/history.jsonl, queue/ and courses/ back to the repo
  models: read             # GitHub Models (free LLM) through the built-in GITHUB_TOKEN
  actions: write           # deletes this run's hand-over files once the video is delivered

jobs:
  make:
    name: ${{ inputs.topic }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      key: ${{ steps.farm.outputs.key }}
      parts: ${{ steps.farm.outputs.parts }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}     # a course file planned moments ago is there

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        if: inputs.video
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Video renderer
        if: inputs.video
        working-directory: video
        run: npm ci --no-audit --no-fund && npx remotion browser ensure

      # the narration in the channel owner's own voice (Chatterbox + faster-whisper, MIT): its own environment,
      # kept with the downloaded models between runs. The voice sample itself stays in the private storage bucket.
      - name: Keep the voice environment between runs
        if: inputs.video && vars.NARRATOR_VOICE != 'standard'
        uses: actions/cache@v4
        with:
          path: |
            .voice
            ~/.cache/huggingface
          key: voice-chatterbox-0.1.7-fw-${{ runner.os }}-py313-v1

      - name: Voice cloning environment
        if: inputs.video && vars.NARRATOR_VOICE != 'standard'
        continue-on-error: true       # without it the standard voice speaks: a video is never lost to this step
        run: |
          ready() { .voice/bin/python -c "import chatterbox, faster_whisper" 2>/dev/null; }
          if ! ready; then
            rm -rf .voice && python -m venv .voice
            .voice/bin/pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
            .voice/bin/pip install -q chatterbox-tts==0.1.7 faster-whisper
          fi
          if ready; then echo "VOICE_PYTHON=$GITHUB_WORKSPACE/.voice/bin/python" >> "$GITHUB_ENV"
          else echo "the voice environment did not install: the standard voice will speak"; fi

      # the delivered video is encoded with AV1 (small and sharp): Ubuntu's ffmpeg has the SVT-AV1 encoder
      - name: Video encoder (AV1)
        if: inputs.video
        run: |
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libsvtav1 ||
            { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libsvtav1|libx265" || echo "no AV1 or HEVC encoder: H.264 is kept"

      # Every repository secret and variable becomes an environment variable of the same name, so a new API key
      # only has to be added in Settings -> Secrets and variables -> Actions (no change to this file).
      - name: Load all secrets and variables
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          python - <<'EOF'
          import json, os, re, secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for source in ("ALL_VARS", "ALL_SECRETS"):           # a secret wins over a variable of the same name
                  for key, value in json.loads(os.environ.get(source) or "{}").items():
                      if key.lower() == "github_token" or not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                          continue
                      mark = "END_" + secrets.token_hex(8)
                      env.write(f"{key}<<{mark}\n{value}\n{mark}\n")
          EOF

      - name: Research, write and make the videos
        id: run
        env:
          # inputs reach the script as environment variables, never pasted into the shell command
          RUN_TOPIC: ${{ inputs.topic }}
          RUN_SOURCE: ${{ inputs.source }}
          RUN_STYLE: ${{ inputs.style }}
          RUN_MODE: ${{ inputs.mode }}
          RUN_LEVEL: ${{ inputs.level }}
          RUN_PUBLISH: ${{ inputs.publish }}
          RUN_VIDEO: ${{ inputs.video }}
          RUN_LESSON: ${{ inputs.course != '' && format('{0}:{1}', inputs.course, inputs.lesson_id) || '' }}
          ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RENDER_FARM: "1"           # a long video is rendered by the parallel "render" jobs below
        run: |
          export LLM_PROVIDERS="${LLM_PROVIDERS:-cerebras,groq,gemini,nvidia,openrouter,github}"  # no Ollama here
          export GITHUB_MODELS_TOKEN="${GITHUB_MODELS_TOKEN:-$ACTIONS_TOKEN}"
          export GUMROAD_PRICE="${GUMROAD_PRICE:-99 INR}"       # each document's price on Gumroad
          args=(--source "$RUN_SOURCE" --mode "$RUN_MODE" --level "$RUN_LEVEL")
          [ -z "$RUN_STYLE" ] || args+=(--style "$RUN_STYLE")
          [ "$RUN_PUBLISH" = "true" ] || args+=(--no-publish)
          [ "$RUN_VIDEO" != "true" ] || args+=(--video)
          [ -z "$RUN_LESSON" ] || args+=(--lesson "$RUN_LESSON")
          python -u main.py "$RUN_TOPIC" "${args[@]}" 2>&1 | tee run.log
          status=${PIPESTATUS[0]}
          # the report can succeed while the video fails; a queued topic only counts as made with its video
          if [ "$RUN_VIDEO" = "true" ] && grep -q '^\[video\] FAILED' run.log; then status=1; fi
          exit $status

      - name: Hand the long video to the render machines
        id: farm
        if: inputs.video && steps.run.outcome == 'success'
        run: |
          plan=video/public/job/render_plan.json
          if [ -f "$plan" ]; then
            out=$(dirname "$(ls -d output/*/video/finish.json | head -1)")
            key=$(basename "$(dirname "$out")")
            echo "key=$key" >> "$GITHUB_OUTPUT"
            echo "parts=$(jq -c '[range(0; .parts | length)]' "$plan")" >> "$GITHUB_OUTPUT"
            echo "out=$out" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep the job folder for the render machines
        if: steps.farm.outputs.key != ''
        uses: actions/upload-artifact@v4
        with:
          name: job-${{ steps.farm.outputs.key }}
          path: video/public/job
          retention-days: 1

      - name: Keep the finished files for the last stage
        if: steps.farm.outputs.key != ''
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ steps.farm.outputs.key }}
          path: ${{ steps.farm.outputs.out }}
          retention-days: 1

      - name: Save story history and queue
        if: always() && (steps.run.outcome == 'success' || inputs.queue_id != '')
        env:
          QUEUE_ID: ${{ inputs.queue_id }}
          OUTCOME: ${{ steps.run.outcome }}
          RUN_TOPIC: ${{ inputs.topic }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$QUEUE_ID" ]; then
            export FLAG=$([ "$OUTCOME" = "success" ] && echo --ok || echo --failed)
            export APPLY='python blogwriter/videoqueue.py done "$QUEUE_ID" "$FLAG"'
          fi
          export MSG="$( [ -n "$QUEUE_ID" ] && echo queue || echo history ): $RUN_TOPIC $(date -u +%F)"
          cp .github/scripts/commit.sh "$RUNNER_TEMP/commit.sh"     # the checkout is reset while it runs
          bash "$RUNNER_TEMP/commit.sh"

  # one machine per part of the long video, all at once
  render:
    needs: make
    if: needs.make.outputs.key != ''
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: true
      matrix:
        part: ${{ fromJSON(needs.make.outputs.parts) }}
    name: render part ${{ matrix.part }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Video renderer
        working-directory: video
        run: npm ci --no-audit --no-fund && npx remotion browser ensure
      - uses: actions/download-artifact@v4
        with:
          name: job-${{ needs.make.outputs.key }}
          path: video/public/job
      - name: Render this part
        working-directory: video
        env:
          PART: ${{ matrix.part }}
        run: |
          mapfile -t args < <(jq -r ".parts[$PART].args[]" public/job/render_plan.json)
          mkdir -p parts
          npx remotion "${args[@]}" || npx remotion "${args[@]}"       # once more if the browser stumbled
      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ needs.make.outputs.key }}-${{ matrix.part }}
          path: video/parts
          retention-days: 1

  # join the parts, check the video, write the posting guide and email it
  finish:
    needs: [make, render]
    if: needs.make.outputs.key != '' && needs.render.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 300           # the one AV1 encode of a 4K (or 8K) video happens here
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Video encoder (AV1)
        run: |
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libsvtav1 ||
            { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg; }
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -E "libsvtav1|libx265" || echo "no AV1 or HEVC encoder: H.264 is kept"
      - name: Load all secrets and variables
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          python - <<'EOF'
          import json, os, re, secrets
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for source in ("ALL_VARS", "ALL_SECRETS"):
                  for key, value in json.loads(os.environ.get(source) or "{}").items():
                      if key.lower() == "github_token" or not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                          continue
                      mark = "END_" + secrets.token_hex(8)
                      env.write(f"{key}<<{mark}\n{value}\n{mark}\n")
          EOF
      - uses: actions/download-artifact@v4
        with:
          name: out-${{ needs.make.outputs.key }}
          path: output/${{ needs.make.outputs.key }}/video
      - uses: actions/download-artifact@v4
        with:
          pattern: part-${{ needs.make.outputs.key }}-*
          path: output/${{ needs.make.outputs.key }}/video/parts
          merge-multiple: true
      - name: Join, check and deliver
        env:
          KEY: ${{ needs.make.outputs.key }}
        run: python -u -m blogwriter.video finish "output/$KEY/video"
      - name: Delete the hand-over files
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ needs.make.outputs.key }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          gh api "repos/$REPO/actions/runs/$RUN/artifacts?per_page=100" --jq ".artifacts[] | select(.name | contains(\"$KEY\")) | .id" |
            while read -r id; do gh api -X DELETE "repos/$REPO/actions/artifacts/$id" || true; done

  # a course lesson reports back whether its video was made
  record:
    needs: [make, render, finish]
    if: always() && inputs.course != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mark the lesson done or failed
        env:
          SLUG: ${{ inputs.course }}
          LESSON: ${{ inputs.lesson_id }}
          OK: ${{ needs.make.result == 'success' && needs.render.result != 'failure' && needs.render.result != 'cancelled' && needs.finish.result != 'failure' && needs.finish.result != 'cancelled' }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          export FLAG=$([ "$OK" = "true" ] && echo --ok || echo --failed)
          export APPLY='python3 blogwriter/course.py done "$SLUG" "$LESSON" "$FLAG"'
          export MSG="course: $SLUG $LESSON $FLAG"
          cp .github/scripts/commit.sh "$RUNNER_TEMP/commit.sh"
          bash "$RUNNER_TEMP/commit.sh"
