name: Monthly report

# On the 1st of every month: last month's YouTube numbers by email (blogwriter/monthly.py). Reads only.
on:
  schedule:
    - cron: "30 3 1 * *"          # 03:30 UTC on the 1st
  workflow_dispatch:
    inputs:
      month:
        description: "Month as YYYY-MM (empty: last month)"
        required: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Report
        env:
          # only what this job uses, named one by one (see youtube-upload.yml)
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MONTH: ${{ inputs.month }}
        run: python -u -m blogwriter.monthly $MONTH
