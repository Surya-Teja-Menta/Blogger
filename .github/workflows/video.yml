name: Make a video

# Actions -> Make a video -> Run workflow: type any topic, a story, a lesson or a concept. Everything typed is ONE video
# (commas, lines, checklists included). For more videos, run it again: each run joins the line (queue/now.jsonl) and
# the "Video queue" workflow makes them one after another, oldest first. (A whole course: use "Make a course".)
# The video is emailed to MAIL_TO for review and never posted. The repo is public: do not type private details.
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "What the video is about. Everything typed here is ONE video. More videos? Run this again: they wait in line and are made one after another"
        required: true
      style:
        description: "auto = let the AI choose | education = lesson with the maths | story = narrative | concept = big idea explained | news = today's news on it"
        type: choice
        options: [auto, education, story, concept, news]
        default: auto
      level:
        description: "Audience level"
        type: choice
        options: [basic, intermediate, advanced]
        default: intermediate
      depth:
        description: "Research depth"
        type: choice
        options: [fast, standard, deep]
        default: standard
      notes:
        description: "Optional notes for this video, e.g. make it retro / also cover caching / keep it under 8 minutes (public repo: no private details)"
        default: ""
      publish:
        description: "Also write the report, list it on Gumroad and post it to the blogs (off = only the video is made and emailed)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join the line
        env:
          # inputs reach the script as environment variables, never pasted into the shell command
          TOPIC: ${{ inputs.topic }}
          STYLE: ${{ inputs.style }}
          LEVEL: ${{ inputs.level }}
          DEPTH: ${{ inputs.depth }}
          NOTES: ${{ inputs.notes }}
          PUBLISH: ${{ inputs.publish && '--publish' || '' }}
          MSG: "video line: a new topic"
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          export APPLY='python3 blogwriter/videoqueue.py push "$TOPIC" --style "$STYLE" --level "$LEVEL" --mode "$DEPTH" --notes "$NOTES" $PUBLISH | tee -a "$GITHUB_STEP_SUMMARY"'
          cp .github/scripts/commit.sh "$RUNNER_TEMP/commit.sh"
          bash "$RUNNER_TEMP/commit.sh"
      - name: Start the line (a run already making a video picks this one up when it finishes)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run video-queue.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
