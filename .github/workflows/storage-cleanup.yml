name: Clean up storage

# Every Sunday: in the Cloudflare bucket, the 4 newest video folders (videos/<run>/) stay with everything in them;
# every older video folder is emptied, except its PDFs. Nothing else in the bucket is touched (reports, the voice
# sample, the voice farm). A folder younger than 24 hours is never deleted. Run it by hand with "dry run" ticked to
# see what it would delete.
on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        type: boolean
        default: true
      keep:
        description: "How many of the newest video folders to keep whole"
        default: "4"

concurrency:
  group: storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Clean up
        env:
          # only the bucket, named one by one (loading every secret at once made GitHub hold each run for approval)
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          # a scheduled run has no inputs: it deletes for real; a manual run is a dry run unless unticked
          CLEANUP_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          CLEANUP_KEEP: ${{ inputs.keep || '4' }}
        run: python -u -m blogwriter.cleanup
