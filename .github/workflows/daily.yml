name: Daily news

# Every morning: one job per news topic (today's hottest story on it) plus the oldest topics waiting in the video
# queue, all in parallel. Each makes a report and videos, emailed for review; nothing is posted to YouTube.
# GitHub cron is UTC: 03:30 UTC = 09:00 IST.
on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:       # run today's batch by hand: Actions -> Daily news -> Run workflow
    inputs:
      news_topics:
        description: "News topics, comma separated (blank = the NEWS_TOPICS variable, else geopolitics,technology)"
        default: ""
      take:
        description: "How many queued topics to make in this run"
        default: "2"
      video:
        description: "Make the videos too"
        type: boolean
        default: true

permissions:
  contents: write
  models: read

concurrency:
  group: daily-news        # two batches never pick the same queued topics
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          NEWS: ${{ inputs.news_topics || vars.NEWS_TOPICS || 'geopolitics,technology' }}
          TAKE: ${{ inputs.take || vars.QUEUE_PER_DAY || '2' }}
        run: |
          jobs="$(python3 blogwriter/videoqueue.py plan --news "$NEWS" --take "$TAKE")"
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "$jobs" | python3 -c "import json,sys; [print('-', j['topic'], '(' + j['style'] + ')') for j in json.load(sys.stdin)]"

  make:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    strategy:
      fail-fast: false     # one failed topic never stops the others
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    uses: ./.github/workflows/make.yml
    with:
      topic: ${{ matrix.job.topic }}
      source: ${{ matrix.job.source }}
      style: ${{ matrix.job.style }}
      mode: ${{ matrix.job.mode }}
      level: ${{ matrix.job.level }}
      publish: ${{ matrix.job.publish }}
      video: ${{ github.event_name == 'schedule' || inputs.video }}
      queue_id: ${{ matrix.job.id }}
    secrets: inherit
