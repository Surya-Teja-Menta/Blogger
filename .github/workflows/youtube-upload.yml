name: Upload to YouTube
run-name: "Upload ${{ inputs.what || 'from issue' }} ${{ inputs.run || github.event.issue.title }}"

# Started by the Upload buttons in the video email. One click goes to the upload relay (upload_worker/, a Cloudflare
# Worker), which checks the video's private key and starts this job through workflow_dispatch. This job holds the
# YouTube sign-in (GitHub Secrets YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN): it takes the files of that run
# from the private bucket, uploads them (title, description and tags from youtube.json) and emails the YouTube links.
# An item already uploaded is never uploaded twice. Without the relay, the buttons open a ready-filled issue
# "upload video|short|both <run folder>" instead: when the OWNER presses Create, this job runs too and also answers on
# the issue. Issues opened by anyone else never start an upload. It can also be started by hand from the Actions tab.
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      what:
        description: "What to upload"
        type: choice
        options: [video, short, both]
        default: video
      run:
        description: "The run folder, e.g. 20261113_053132_Statistics_Types_of_data"
        required: true

permissions:
  contents: read
  issues: write

# one queue per video: GitHub keeps only ONE waiting run per group, so a single shared group would silently cancel
# a click on a second video while a third waited. Different videos upload side by side; the Worker already refuses a
# second job for the same video while one runs.
concurrency:
  group: youtube-upload-${{ inputs.run || github.event.issue.title }}
  cancel-in-progress: false

jobs:
  upload:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'upload '))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Upload
        env:
          # only what this job uses, named one by one (loading every secret at once made GitHub flag the file as
          # possibly malicious and hold each run for approval): the YouTube sign-in, the bucket, the email
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY }}
          UPLOAD_EMAIL: ${{ vars.UPLOAD_EMAIL }}
          # inputs reach the script as environment variables, never pasted into the shell command; the script
          # accepts only "upload video|short|both <run folder>"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          WHAT: ${{ inputs.what }}
          RUN_FOLDER: ${{ inputs.run }}
        run: |
          if [ -n "$ISSUE_TITLE" ]; then request="$ISSUE_TITLE"; else request="upload $WHAT $RUN_FOLDER"; fi
          python -u -m blogwriter.youtube "$request" upload_result.md
      - name: Answer on the issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          [ -s upload_result.md ] || echo "The upload job stopped before it could report. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > upload_result.md
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file upload_result.md
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
